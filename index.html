<!DOCTYPE html>
<html>
<head>
    <title>DIY Backyard ABS</title>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; text-align: center; z-index: 2;}
        video, canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;}
        canvas { z-index: 10; }
    
</head>
<body>

    <!-- Camera Feed Layer -->
    <video id="webcam" autoplay playsinline></video>
    <!-- Digital Strike Zone Layer -->
    <canvas id="overlay"></canvas>

    <button id="cal_btn" onclick="takeSnapshot()">Calibrate Target</button>button>
        </style/>
            #calbtn {
                position: absolute;
                bottom: 20px
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                padding: 15px 30px;
                font-size: 20px;
                background-color: #327a62;
                color: white;
                border: none;
                z-index: 3;
            }
    <script>
        let baselineBrightness = 0; // Our empty memory box

function takeSnapshot() {
    // 1. Grab the current image details from inside the strike zone square
    let boxData = ctx.getImageData(window.innerWidth/3, window.innerHeight/4, window.innerWidth/3, window.innerHeight/2);
    let pixels = boxData.data;
    let total = 0;

    // 2. Add up the color values of the background pixels
    for (let i = 0; i < pixels.length; i += 4) {
        total += (pixels[i] + pixels[i+1] + pixels[i+2]) / 3;
    }

    // 3. Save the average baseline number into our memory box
    baselineBrightness = total / (pixels.length / 4);
    
    // 4. Turn the button green temporarily so you know it successfully calibrated!
    document.getElementById('calibrateBtn').style.backgroundColor = "#34C759";
    document.getElementById('calibrateBtn').innerText = "Calibrated!";
    
    setTimeout(() => {
        document.getElementById('calibrateBtn').style.backgroundColor = "#007AFF";
        document.getElementById('calibrateBtn').innerText = "Calibrate Target";
    }, 1500);
}

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');

        // Start iPad back camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => console.error("Camera error: ", err));

        // Draw static 2D Strike Zone Box once video loads
        video.addEventListener('loadedmetadata', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Draw a basic white strike zone box in center screen
            ctx.strokeStyle = "white";
            ctx.lineWidth = 5;
            ctx.strokeRect(window.innerWidth/3, window.innerHeight/4, window.innerWidth/3, window.innerHeight/2);
        });
    </script>
</body>
</html>
