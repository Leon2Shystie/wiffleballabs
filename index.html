<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wiffle Ball ABS Camera</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #call-banner {
      position: absolute;
      top: 20px;
      font-size: 3.5rem;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      z-index: 10;
      pointer-events: none;
    }
    .strike { color: #ff1744; }
    .ball { color: #00e676; }
    .edge { color: #ffea00; }
    
    #controls {
      height: 20vh;
      width: 100%;
      background: #121212;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    button {
      background: #2979ff;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 1.2rem;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
  <!-- Load OpenCV.js for Computer Vision -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
    <div id="call-banner">READY</div>
  </div>

  <div id="controls">
    <button onclick="resetCall()">RESET CALL</button>
    <button onclick="toggleTracking()" id="trackBtn">START ABS</button>
  </div>

  <script>
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('outputCanvas');
    let ctx = canvas.getContext('2d');
    let banner = document.getElementById('call-banner');
    
    let isTracking = false;
    let cvReady = false;
    
    // Define Strike Zone Boundaries (Percent of Canvas)
    const zone = {
      xMin: 0.35,
      xMax: 0.65,
      yMin: 0.30,
      yMax: 0.70,
      margin: 0.05 // Edge tolerance (5%)
    };

    function onOpenCvReady() {
      cvReady = true;
      banner.innerText = "CAMERA READY";
      startCamera();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", frameRate: { ideal: 60 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        };
      } catch (err) {
        alert("Camera Access Error: " + err.message);
      }
    }

    function toggleTracking() {
      if (!cvReady) return;
      isTracking = !isTracking;
      document.getElementById('trackBtn').innerText = isTracking ? "PAUSE ABS" : "START ABS";
      if (isTracking) processVideo();
    }

    function processVideo() {
      if (!isTracking) return;

      // Draw original camera frame
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Calculate Strike Zone Pixel Coordinates
      const szLeft = canvas.width * zone.xMin;
      const szRight = canvas.width * zone.xMax;
      const szTop = canvas.height * zone.yMin;
      const szBottom = canvas.height * zone.yMax;
      const szWidth = szRight - szLeft;
      const szHeight = szBottom - szTop;

      // Draw Strike Zone Outer Box & Inner Zone
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 4;
      ctx.strokeRect(szLeft, szTop, szWidth, szHeight);
      
      // Draw Edge Threshold Margin
      const edgePx = canvas.width * zone.margin;
      ctx.strokeStyle = 'rgba(255, 234, 0, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(szLeft - edgePx, szTop - edgePx, szWidth + (edgePx * 2), szHeight + (edgePx * 2));

      // OpenCV Motion & Object Detection Logic
      let src = cv.imread(video);
      let hsv = new cv.Mat();
      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

      // Color Range Thresholding (Set for White/Bright Wiffle Ball)
      let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 0, 200, 0]);
      let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [180, 55, 255, 255]);
      let mask = new cv.Mat();
      cv.inRange(hsv, low, high, mask);

      // Find Ball Contours
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let circle = cv.minEnclosingCircle(cnt);
        let area = cv.contourArea(cnt);

        // Filter based on expected ball size in pixels
        if (area > 100 && area < 5000) {
          let ballX = circle.center.x;
          let ballY = circle.center.y;
          let radius = circle.radius;

          // Highlight tracked ball frame
          ctx.beginPath();
          ctx.arc(ballX, ballY, radius, 0, 2 * Math.PI);
          ctx.fillStyle = 'cyan';
          ctx.fill();

          // Check Ball Location against Strike Zone
          evaluatePitch(ballX, ballY, szLeft, szRight, szTop, szBottom, edgePx);
        }
      }

      // Cleanup memory
      src.delete(); hsv.delete(); low.delete(); high.delete(); mask.delete(); contours.delete(); hierarchy.delete();

      requestAnimationFrame(processVideo);
    }

    function evaluatePitch(x, y, left, right, top, bottom, margin) {
      // Check if inside zone
      const isInsideX = x >= left && x <= right;
      const isInsideY = y >= top && y <= bottom;

      // Check if on the edge
      const isEdgeX = (x >= left - margin && x <= left) || (x >= right && x <= right + margin);
      const isEdgeY = (y >= top - margin && y <= top) || (y >= bottom && y <= bottom + margin);

      if (isInsideX && isInsideY) {
        banner.innerText = "STRIKE!";
        banner.className = "strike";
      } else if ((isEdgeX && (isInsideY || isEdgeY)) || (isEdgeY && (isInsideX || isEdgeX))) {
        banner.innerText = "BORDERLINE (EDGE)";
        banner.className = "edge";
      } else {
        banner.innerText = "BALL!";
        banner.className = "ball";
      }
    }

    function resetCall() {
      banner.innerText = "READY";
      banner.className = "";
    }
  </script>
</body>
</html>
