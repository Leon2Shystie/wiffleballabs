<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wiffle Ball ABS Camera</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #call-banner {
      position: absolute;
      top: 15px;
      font-size: 3rem;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      z-index: 10;
      pointer-events: none;
    }
    .strike { color: #ff1744; }
    .ball { color: #00e676; }
    .edge { color: #ffea00; }
    
    #controls {
      height: 25vh;
      width: 100%;
      background: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      z-index: 10;
      gap: 15px;
    }
    .btn-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 500px;
    }
    button {
      background: #2979ff;
      color: white;
      border: none;
      padding: 15px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      font-weight: bold;
    }
    .pick-btn {
      background: #ff9100;
    }
    #colorPreview {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid white;
      vertical-align: middle;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
    <div id="call-banner">READY</div>
  </div>

  <div id="controls">
    <div class="btn-row">
      <button onclick="resetCall()">RESET CALL</button>
      <button class="pick-btn" onclick="enableColorPicker()" id="pickBtn">
        PICK COLOR <span id="colorPreview"></span>
      </button>
      <button onclick="toggleTracking()" id="trackBtn">START ABS</button>
    </div>
  </div>

  <script>
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('outputCanvas');
    let ctx = canvas.getContext('2d');
    let banner = document.getElementById('call-banner');

    let isTracking = false;
    let isPickingColor = false;
    let animId = null;

    // Selected RGB Target Color
    let targetRGB = { r: 255, g: 255, b: 255 };
    let colorTolerance = 45; // Automatic color match radius

    const zone = {
      xMin: 0.35,
      xMax: 0.65,
      yMin: 0.30,
      yMax: 0.70,
      margin: 0.05
    };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.play();

        video.addEventListener('loadeddata', () => {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          banner.innerText = "READY";
          updateColorPreview();
        });
      } catch (err) {
        alert("Camera Error: Ensure page is loaded over HTTPS.");
      }
    }

    window.onload = startCamera;

    function enableColorPicker() {
      if (isTracking) toggleTracking();
      isPickingColor = true;
      banner.innerText = "TOUCH THE BALL ON SCREEN";
      banner.className = "edge";
      
      // Draw static video frame to allow accurate tapping
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    // Touch Event listener to pick color directly from the iPad screen
    canvas.addEventListener('touchstart', handleCanvasTap);
    canvas.addEventListener('mousedown', handleCanvasTap);

    function handleCanvasTap(e) {
      if (!isPickingColor) return;
      e.preventDefault();

      let rect = canvas.getBoundingClientRect();
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let scaleX = canvas.width / rect.width;
      let scaleY = canvas.height / rect.height;

      let canvasX = Math.floor((clientX - rect.left) * scaleX);
      let canvasY = Math.floor((clientY - rect.top) * scaleY);

      // Extract RGB values from tapped pixel
      let pixelData = ctx.getImageData(canvasX, canvasY, 1, 1).data;
      targetRGB = { r: pixelData[0], g: pixelData[1], b: pixelData[2] };

      updateColorPreview();
      isPickingColor = false;
      banner.innerText = "COLOR SET!";
      banner.className = "ball";
    }

    function updateColorPreview() {
      let preview = document.getElementById('colorPreview');
      preview.style.backgroundColor = `rgb(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b})`;
    }

    function toggleTracking() {
      if (isPickingColor) isPickingColor = false;
      isTracking = !isTracking;
      document.getElementById('trackBtn').innerText = isTracking ? "PAUSE ABS" : "START ABS";

      if (isTracking) {
        renderLoop();
      } else if (animId) {
        cancelAnimationFrame(animId);
      }
    }

    function renderLoop() {
      if (!isTracking) return;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = frame.data;

      const szLeft = canvas.width * zone.xMin;
      const szRight = canvas.width * zone.xMax;
      const szTop = canvas.height * zone.yMin;
      const szBottom = canvas.height * zone.yMax;
      const szWidth = szRight - szLeft;
      const szHeight = szBottom - szTop;
      const edgePx = canvas.width * zone.margin;

      let totalX = 0, totalY = 0, matchCount = 0;

      // Scan every 4th pixel for color similarity
      for (let i = 0; i < data.length; i += 16) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        // Euclidean color distance from chosen target color
        let distance = Math.sqrt(
          Math.pow(r - targetRGB.r, 2) +
          Math.pow(g - targetRGB.g, 2) +
          Math.pow(b - targetRGB.b, 2)
        );

        if (distance <= colorTolerance) {
          let pixelIndex = i / 4;
          let x = pixelIndex % canvas.width;
          let y = Math.floor(pixelIndex / canvas.width);

          totalX += x;
          totalY += y;
          matchCount++;
        }
      }

      // Draw tracked ball marker if matching pixels are detected
      if (matchCount > 10 && matchCount < 3000) {
        let avgX = totalX / matchCount;
        let avgY = totalY / matchCount;

        ctx.beginPath();
        ctx.arc(avgX, avgY, 18, 0, 2 * Math.PI);
        ctx.fillStyle = '#00e5ff';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        evaluatePitch(avgX, avgY, szLeft, szRight, szTop, szBottom, edgePx);
      }

      // Draw strike zone rectangle overlay
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 4;
      ctx.strokeRect(szLeft, szTop, szWidth, szHeight);

      ctx.strokeStyle = 'rgba(255, 234, 0, 0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(szLeft - edgePx, szTop - edgePx, szWidth + (edgePx * 2), szHeight + (edgePx * 2));

      animId = requestAnimationFrame(renderLoop);
    }

    function evaluatePitch(x, y, left, right, top, bottom, margin) {
      const isInsideX = x >= left && x <= right;
      const isInsideY = y >= top && y <= bottom;

      const isEdgeX = (x >= left - margin && x <= left) || (x >= right && x <= right + margin);
      const isEdgeY = (y >= top - margin && y <= top) || (y >= bottom && y <= bottom + margin);

      if (isInsideX && isInsideY) {
        banner.innerText = "STRIKE!";
        banner.className = "strike";
      } else if ((isEdgeX && (isInsideY || isEdgeY)) || (isEdgeY && (isInsideX || isEdgeX))) {
        banner.innerText = "BORDERLINE (EDGE)";
        banner.className = "edge";
      } else {
        banner.innerText = "BALL!";
        banner.className = "ball";
      }
    }

    function resetCall() {
      banner.innerText = "READY";
      banner.className = "";
    }
  </script>
</body>
</html>
