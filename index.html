<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wiffle Ball ABS Camera</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #call-banner {
      position: absolute;
      top: 15px;
      font-size: 3rem;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      z-index: 10;
      pointer-events: none;
    }
    .strike { color: #ff1744; }
    .ball { color: #00e676; }
    .edge { color: #ffea00; }
    
    #controls {
      height: 35vh;
      width: 100%;
      background: #121212;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      z-index: 10;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
    }
    button {
      background: #2979ff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      font-weight: bold;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .slider-row label {
      width: 120px;
    }
    .slider-row input {
      flex-grow: 1;
    }
    .preset-btn {
      background: #424242;
      font-size: 0.85rem;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
    <div id="call-banner">READY</div>
  </div>

  <div id="controls">
    <div class="btn-row">
      <button onclick="resetCall()">RESET CALL</button>
      <button onclick="toggleTracking()" id="trackBtn">START ABS</button>
    </div>

    <div class="slider-group">
      <div class="btn-row">
        <button class="preset-btn" onclick="setPreset('white')">Preset: White Ball</button>
        <button class="preset-btn" onclick="setPreset('yellow')">Preset: Yellow Ball</button>
      </div>
      <div class="slider-row">
        <label>Hue (Color): <span id="hueVal">0</span></label>
        <input type="range" id="hue" min="0" max="360" value="0" oninput="updateSliders()">
      </div>
      <div class="slider-row">
        <label>Hue Range: <span id="hueTolVal">40</span></label>
        <input type="range" id="hueTol" min="5" max="100" value="40" oninput="updateSliders()">
      </div>
      <div class="slider-row">
        <label>Min Brightness: <span id="brightVal">180</span></label>
        <input type="range" id="brightness" min="0" max="255" value="180" oninput="updateSliders()">
      </div>
    </div>
  </div>

  <script>
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('outputCanvas');
    let ctx = canvas.getContext('2d');
    let banner = document.getElementById('call-banner');

    let isTracking = false;
    let animId = null;

    // Detection Settings controlled by Sliders
    let targetHue = 0;
    let hueTolerance = 40;
    let minBrightness = 180;

    const zone = {
      xMin: 0.35,
      xMax: 0.65,
      yMin: 0.30,
      yMax: 0.70,
      margin: 0.05
    };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.play();

        video.addEventListener('loadeddata', () => {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          banner.innerText = "READY";
        });
      } catch (err) {
        alert("Camera Error: Ensure page is loaded over HTTPS.");
      }
    }

    window.onload = startCamera;

    function updateSliders() {
      targetHue = parseInt(document.getElementById('hue').value);
      hueTolerance = parseInt(document.getElementById('hueTol').value);
      minBrightness = parseInt(document.getElementById('brightness').value);

      document.getElementById('hueVal').innerText = targetHue;
      document.getElementById('hueTolVal').innerText = hueTolerance;
      document.getElementById('brightVal').innerText = minBrightness;
    }

    function setPreset(type) {
      if (type === 'white') {
        document.getElementById('hue').value = 0;
        document.getElementById('hueTol').value = 180;
        document.getElementById('brightness').value = 200;
      } else if (type === 'yellow') {
        document.getElementById('hue').value = 60;
        document.getElementById('hueTol').value = 30;
        document.getElementById('brightness').value = 140;
      }
      updateSliders();
    }

    function toggleTracking() {
      isTracking = !isTracking;
      document.getElementById('trackBtn').innerText = isTracking ? "PAUSE ABS" : "START ABS";

      if (isTracking) {
        renderLoop();
      } else if (animId) {
        cancelAnimationFrame(animId);
      }
    }

    // Convert RGB to HSV Hue value (0-360)
    function getHue(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0;
      if (max !== min) {
        let d = max - min;
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return h * 360;
    }

    function renderLoop() {
      if (!isTracking) return;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = frame.data;

      const szLeft = canvas.width * zone.xMin;
      const szRight = canvas.width * zone.xMax;
      const szTop = canvas.height * zone.yMin;
      const szBottom = canvas.height * zone.yMax;
      const szWidth = szRight - szLeft;
      const szHeight = szBottom - szTop;
      const edgePx = canvas.width * zone.margin;

      let totalX = 0, totalY = 0, matchCount = 0;

      // Scan every 16th byte (step 4 pixels for performance)
      for (let i = 0; i < data.length; i += 16) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        // Check brightness threshold
        let brightness = (r + g + b) / 3;
        if (brightness >= minBrightness) {
          let hue = getHue(r, g, b);
          let hueDiff = Math.abs(hue - targetHue);

          if (hueDiff <= hueTolerance || (360 - hueDiff) <= hueTolerance) {
            let pixelIndex = i / 4;
            let x = pixelIndex % canvas.width;
            let y = Math.floor(pixelIndex / canvas.width);

            totalX += x;
            totalY += y;
            matchCount++;
          }
        }
      }

      // Draw tracking circle if enough matching color pixels are found
      if (matchCount > 10 && matchCount < 3000) {
        let avgX = totalX / matchCount;
        let avgY = totalY / matchCount;

        ctx.beginPath();
        ctx.arc(avgX, avgY, 16, 0, 2 * Math.PI);
        ctx.fillStyle = '#00e5ff';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        evaluatePitch(avgX, avgY, szLeft, szRight, szTop, szBottom, edgePx);
      }

      // Draw strike zone graphics
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 4;
      ctx.strokeRect(szLeft, szTop, szWidth, szHeight);

      ctx.strokeStyle = 'rgba(255, 234, 0, 0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(szLeft - edgePx, szTop - edgePx, szWidth + (edgePx * 2), szHeight + (edgePx * 2));

      animId = requestAnimationFrame(renderLoop);
    }

    function evaluatePitch(x, y, left, right, top, bottom, margin) {
      const isInsideX = x >= left && x <= right;
      const isInsideY = y >= top && y <= bottom;

      const isEdgeX = (x >= left - margin && x <= left) || (x >= right && x <= right + margin);
      const isEdgeY = (y >= top - margin && y <= top) || (y >= bottom && y <= bottom + margin);

      if (isInsideX && isInsideY) {
        banner.innerText = "STRIKE!";
        banner.className = "strike";
      } else if ((isEdgeX && (isInsideY || isEdgeY)) || (isEdgeY && (isInsideX || isEdgeX))) {
        banner.innerText = "BORDERLINE (EDGE)";
        banner.className = "edge";
      } else {
        banner.innerText = "BALL!";
        banner.className = "ball";
      }
    }

    function resetCall() {
      banner.innerText = "READY";
      banner.className = "";
    }
  </script>
</body>
</html>
