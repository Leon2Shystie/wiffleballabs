<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wiffle Ball ABS Camera</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #call-banner {
      position: absolute;
      top: 20px;
      font-size: 3.5rem;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      z-index: 10;
      pointer-events: none;
    }
    .strike { color: #ff1744; }
    .ball { color: #00e676; }
    .edge { color: #ffea00; }
    
    #controls {
      height: 20vh;
      width: 100%;
      background: #121212;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    button {
      background: #2979ff;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 1.2rem;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
  <!-- Load OpenCV.js for Computer Vision -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
    <div id="call-banner">READY</div>
  </div>

  <div id="controls">
    <button onclick="resetCall()">RESET CALL</button>
    <button onclick="toggleTracking()" id="trackBtn">START ABS</button>
  </div>

 <script>
  let video = document.getElementById('webcam');
  let canvas = document.getElementById('outputCanvas');
  let ctx = canvas.getContext('2d');
  let banner = document.getElementById('call-banner');
  
  let isTracking = false;
  let cvReady = false;
  let animId = null;
  
  // Strike Zone Percentages
  const zone = {
    xMin: 0.35,
    xMax: 0.65,
    yMin: 0.30,
    yMax: 0.70,
    margin: 0.05
  };

  function onOpenCvReady() {
    cvReady = true;
    banner.innerText = "CAMERA READY";
    startCamera();
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.play();
      
      video.addEventListener('loadeddata', () => {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        banner.innerText = "READY";
      });
    } catch (err) {
      alert("Camera Error: Ensure page is HTTPS and permissions allowed.");
    }
  }

  function toggleTracking() {
    isTracking = !isTracking;
    document.getElementById('trackBtn').innerText = isTracking ? "PAUSE ABS" : "START ABS";
    
    if (isTracking) {
      renderLoop();
    } else if (animId) {
      cancelAnimationFrame(animId);
    }
  }

  function renderLoop() {
    if (!isTracking) return;

    // 1. Draw raw video feed onto canvas
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // 2. Define Strike Zone Coordinates
    const szLeft = canvas.width * zone.xMin;
    const szRight = canvas.width * zone.xMax;
    const szTop = canvas.height * zone.yMin;
    const szBottom = canvas.height * zone.yMax;
    const szWidth = szRight - szLeft;
    const szHeight = szBottom - szTop;
    const edgePx = canvas.width * zone.margin;

    // 3. Draw Zone Overlay
    ctx.strokeStyle = '#00e676'; // Strike zone green
    ctx.lineWidth = 4;
    ctx.strokeRect(szLeft, szTop, szWidth, szHeight);
    
    ctx.strokeStyle = 'rgba(255, 234, 0, 0.6)'; // Edge zone yellow
    ctx.lineWidth = 2;
    ctx.strokeRect(szLeft - edgePx, szTop - edgePx, szWidth + (edgePx * 2), szHeight + (edgePx * 2));

    // 4. Lightweight Native Canvas Color Tracking (Prevents iPad Safari crash)
    let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let data = frame.data;
    let totalX = 0, totalY = 0, count = 0;

    // Scan pixels for white/bright wiffle ball
    for (let i = 0; i < data.length; i += 16) { // Step size to save CPU
      let r = data[i];
      let g = data[i + 1];
      let b = data[i + 2];

      // White wiffle ball threshold (High RGB values)
      if (r > 200 && g > 200 && b > 200) {
        let pixelIndex = i / 4;
        let x = pixelIndex % canvas.width;
        let y = Math.floor(pixelIndex / canvas.width);

        totalX += x;
        totalY += y;
        count++;
      }
    }

    if (count > 15) { // Minimum threshold of matching pixels
      let avgX = totalX / count;
      let avgY = totalY / count;

      // Draw tracked ball marker
      ctx.beginPath();
      ctx.arc(avgX, avgY, 15, 0, 2 * Math.PI);
      ctx.fillStyle = '#00e5ff';
      ctx.fill();

      // Check ball position
      evaluatePitch(avgX, avgY, szLeft, szRight, szTop, szBottom, edgePx);
    }

    animId = requestAnimationFrame(renderLoop);
  }

  function evaluatePitch(x, y, left, right, top, bottom, margin) {
    const isInsideX = x >= left && x <= right;
    const isInsideY = y >= top && y <= bottom;

    const isEdgeX = (x >= left - margin && x <= left) || (x >= right && x <= right + margin);
    const isEdgeY = (y >= top - margin && y <= top) || (y >= bottom && y <= bottom + margin);

    if (isInsideX && isInsideY) {
      banner.innerText = "STRIKE!";
      banner.className = "strike";
    } else if ((isEdgeX && (isInsideY || isEdgeY)) || (isEdgeY && (isInsideX || isEdgeX))) {
      banner.innerText = "BORDERLINE (EDGE)";
      banner.className = "edge";
    } else {
      banner.innerText = "BALL!";
      banner.className = "ball";
    }
  }

  function resetCall() {
    banner.innerText = "READY";
    banner.className = "";
  }
</script>
</body>
</html>
