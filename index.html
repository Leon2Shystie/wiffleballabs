<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waffle Ball ABS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .scoreboard {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .count {
      font-size: 3rem;
      font-weight: bold;
      color: #00e676;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }
    button {
      background: #2979ff;
      color: white;
      border: none;
      padding: 25px;
      font-size: 1.5rem;
      border-radius: 10px;
      font-weight: bold;
    }
    button:active { background: #1565c0; }
    .strike-btn { background: #ff1744; }
    .out-btn { background: #d500f9; }
  </style>
</head>
<body>

  <div class="scoreboard">
    <h1 id="inning">TOP 1</h1>
    <div class="count" id="countDisplay">0 - 0</div>
    <h2 id="outsDisplay">Outs: 0</h2>
  </div>

  <div class="btn-grid">
    <button onclick="addBall()">BALL</button>
    <button class="strike-btn" onclick="addStrike()">STRIKE</button>
    <button onclick="resetCount()">WALK / HIT</button>
    <button class="out-btn" onclick="addOut()">OUT</button>
  </div>

  <script>
    let balls = 0;
    let strikes = 0;
    let outs = 0;

    function update() {
      document.getElementById('countDisplay').innerText = `${balls} B - ${strikes} S`;
      document.getElementById('outsDisplay').innerText = `Outs: ${outs}`;
    }

    function addBall() {
      balls++;
      if (balls >= 4) { alert('WALK!'); resetCount(); }
      update();
    }

    function addStrike() {
      strikes++;
      if (strikes >= 3) { alert('STRIKE 3 - OUT!'); addOut(); }
      update();
    }

    function addOut() {
      outs++;
      resetCount();
      if (outs >= 3) { alert('3 OUTS - CHANGE SIDES!'); outs = 0; }
      update();
    }

    function resetCount() {
      balls = 0;
      strikes = 0;
      update();
    }
  </script>
</body>
</html>
